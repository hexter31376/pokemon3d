name: 버그 신고
description: 오류나 예상과 다른 동작을 알려주세요.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 발생한 문제
      description: 어떤 동작에서 문제가 발생했는지 적어주세요.
      placeholder: 예) 특정 모델 조회 API가 500 오류를 반환합니다.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 요청 경로나 실행 순서를 적어주세요.
      placeholder: |
        1. 서버 실행
        2. 해당 API 호출
        3. 응답 확인
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 실행 환경
      placeholder: 예) 로컬 / Docker, Java 버전, 브라우저
  - type: textarea
    id: evidence
    attributes:
      label: 참고 자료
      description: 관련 모델 ID, 로그, 응답 내용이나 스크린샷을 첨부해주세요.
