spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: ${MODEL_DATABASE_URL:jdbc:postgresql://localhost:5432/pokemon3d}
    username: ${MODEL_DATABASE_USERNAME:}
    password: ${MODEL_DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  application:
    name: pokemon3d

pokemon:
  uploads:
    enabled: ${MODEL_UPLOAD_WORKER_ENABLED:false}
    spool-path: ${MODEL_UPLOAD_SPOOL_PATH:runtime-data/uploads}
    poll-delay-ms: 1000
    lease-seconds: 600
    max-attempts: 3
    retry-delay-seconds: 30

  storage:
    s3:
      enabled: ${MODEL_STORAGE_ENABLED:false}
      endpoint: ${MODEL_STORAGE_ENDPOINT:}
      public-base-url: ${MODEL_STORAGE_PUBLIC_BASE_URL:}
      region: ${MODEL_STORAGE_REGION:}
      bucket: ${MODEL_STORAGE_BUCKET:}
      prefix: ${MODEL_STORAGE_PREFIX:}
      access-key: ${MODEL_STORAGE_ACCESS_KEY:}
      secret-key: ${MODEL_STORAGE_SECRET_KEY:}
      path-style: ${MODEL_STORAGE_PATH_STYLE:true}
      connect-timeout: ${MODEL_STORAGE_CONNECT_TIMEOUT:3s}
      attempt-timeout: ${MODEL_STORAGE_ATTEMPT_TIMEOUT:60s}
      request-timeout: ${MODEL_STORAGE_REQUEST_TIMEOUT:180s}
